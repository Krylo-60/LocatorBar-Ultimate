name: Daily Activity & Maintenance

on:
  schedule:
    # Runs automatically once every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger anytime

permissions:
  contents: write

jobs:
  daily-ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update daily maintenance timestamp
        run: |
          mkdir -p .github
          echo "Last active check: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .github/activity.log

      - name: Commit and push daily activity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/activity.log
          if ! git diff --staged --quiet; then
            git commit -m "chore(health): automated repository activity check [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No activity changes to commit"
          fi

