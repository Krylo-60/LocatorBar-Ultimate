name: Build all versions

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Sync target properties
        run: |
          cp gradle/targets/26.2.properties versions/26.2-fabric/gradle.properties

      - name: Inspect Gradle projects
        run: ./gradlew --no-daemon projects --stacktrace

      - name: Check active code
        run: ./gradlew --no-daemon :26.2-fabric:check :1.21.1-neoforge:check --stacktrace

  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: check-code

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 26.2-fabric
            name: "Fabric & Quilt (26.2)"
          - target: 1.21.11-fabric
            name: "Fabric & Quilt (1.21.11)"
          - target: 1.21.1-fabric
            name: "Fabric & Quilt (1.21.1)"
          - target: 1.21.1-neoforge
            name: "NeoForge & Forge (1.21.1)"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Sync target properties
        run: |
          VERSION="${TARGET%-*}"
          cp "gradle/targets/${VERSION}.properties" "versions/${TARGET}/gradle.properties"
        env:
          TARGET: ${{ matrix.target }}

      - name: Switch Stonecutter target
        run: ./gradlew --no-daemon stonecutterSwitchTo${{ matrix.target }} --stacktrace

      - name: Build target
        run: ./gradlew --no-daemon :${{ matrix.target }}:build --stacktrace

      - name: Upload target jars
        uses: actions/upload-artifact@v4
        with:
          name: locatorbar-${{ matrix.target }}
          path: |
            versions/${{ matrix.target }}/build/libs/*.jar
            build/libs/**/*.jar
            !versions/${{ matrix.target }}/build/libs/*-sources.jar
            !versions/${{ matrix.target }}/build/libs/*-dev.jar
            !versions/${{ matrix.target }}/build/libs/*-javadoc.jar
            !build/libs/**/*-sources.jar
            !build/libs/**/*-dev.jar
            !build/libs/**/*-javadoc.jar
          if-no-files-found: warn

  build-paper:
    name: Build Paper, Purpur, Spigot & Folia (Server Plugin)
    runs-on: ubuntu-latest
    needs: check-code

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build Paper Plugin
        run: ./gradlew --no-daemon :paper:build --stacktrace

      - name: Upload Paper Plugin Jar
        uses: actions/upload-artifact@v4
        with:
          name: locatorbar-paper-plugin
          path: paper/build/libs/*.jar
          if-no-files-found: error